name: checking ip address
on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ip:
    runs-on: ubuntu-latest
    steps:
      - name: Get EC2 Runner IP
        run: |
           echo "Private IP:"
           hostname -I
           echo "Public IP:"
           curl -s https://checkip.amazonaws.com
           echo
